name: archive
on:
  schedule:
    - cron: "23 0 * * *"   # 02:23 Cape Town: archives the previous full day
  workflow_dispatch:
    inputs:
      date:
        description: "Day to archive (YYYY-MM-DD, Cape Town). Blank = yesterday."
        required: false
        default: ""
permissions:
  contents: write
concurrency:
  group: data-commit
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Archive full-resolution history
        env:
          TUYA_ACCESS_ID: ${{ secrets.TUYA_ACCESS_ID }}
          TUYA_ACCESS_SECRET: ${{ secrets.TUYA_ACCESS_SECRET }}
          SUNSYNK_USERNAME: ${{ secrets.SUNSYNK_USERNAME }}
          SUNSYNK_PASSWORD: ${{ secrets.SUNSYNK_PASSWORD }}
          TUYA_REGION: eu
          TUYA_DEVICE_ID: bf7df64982f062d651ntsi
          SUNSYNK_INVERTER_SN: "2211304411"
          ARCHIVE_DATE: ${{ github.event.inputs.date }}
        run: node logger.mjs archive
      - name: Commit
        if: always()
        run: |
          git config user.name "geyser-logger"
          git config user.email "geyser-logger@users.noreply.github.com"
          git add archive || true
          git diff --cached --quiet && exit 0
          git commit -m "archive $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do git pull --rebase --quiet && git push --quiet && break; sleep 5; done
