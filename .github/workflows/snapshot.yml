name: snapshot
on:
  schedule:
    - cron: "7,37 * * * *"   #  every 30 minutes (UTC); GitHub may delay or skip runs when busy
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - logger.mjs
      - control.mjs
      - schedule.json
      - prepaid.mjs
      - prepaid.json
      - .github/workflows/**
permissions:
  contents: write
  issues: write
concurrency:
  group: data-commit
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Read geyser and inverter
        env:
          TUYA_ACCESS_ID: ${{ secrets.TUYA_ACCESS_ID }}
          TUYA_ACCESS_SECRET: ${{ secrets.TUYA_ACCESS_SECRET }}
          SUNSYNK_USERNAME: ${{ secrets.SUNSYNK_USERNAME }}
          SUNSYNK_PASSWORD: ${{ secrets.SUNSYNK_PASSWORD }}
          TUYA_REGION: eu
          TUYA_DEVICE_ID: bf7df64982f062d651ntsi
          SUNSYNK_INVERTER_SN: "2211304411"
          GITHUB_TOKEN: ${{ github.token }}
          TANNIE_NOTIFY_URL: https://tannie-production.up.railway.app/notify
          TANNIE_NOTIFY_TOKEN: ${{ secrets.TANNIE_NOTIFY_TOKEN }}
        run: node logger.mjs snapshot
      - name: Commit
        if: always()
        run: |
          git config user.name "geyser-logger"
          git config user.email "geyser-logger@users.noreply.github.com"
          git add samples || true
          git diff --cached --quiet && exit 0
          git commit -m "snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase --quiet && git push --quiet && break; sleep 5; done
